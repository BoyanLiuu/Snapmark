<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!--
    Snapmark's mark, weighted for a tab: the frame, a crosshair tick on each side, and one pixel at
    the centre (components/editor/tools.tsx draws the same shape in the app). Laid out on a 16-unit
    grid with filled rectangles, never strokes, so at 16 px every edge is on a pixel and nothing
    blurs. Colours are the app's own tokens (app/globals.css).
  -->
  <rect width="16" height="16" fill="oklch(9% 0.008 75)" />
  <g fill="oklch(72% 0.17 45)">
    <rect x="3" y="3" width="10" height="2" />
    <rect x="3" y="11" width="10" height="2" />
    <rect x="3" y="5" width="2" height="6" />
    <rect x="11" y="5" width="2" height="6" />
    <rect x="7" width="2" height="5" />
    <rect x="7" y="11" width="2" height="5" />
    <rect y="7" width="5" height="2" />
    <rect x="11" y="7" width="5" height="2" />
    <rect x="7" y="7" width="2" height="2" />
  </g>
</svg>
