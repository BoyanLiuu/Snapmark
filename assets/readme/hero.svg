<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Snapmark</title>
  <desc id="hero-desc">Snapmark: draw on a screenshot, then copy it at the image's own size. On the right, the editor stage: a mock window with a selected rectangle and its eight handles, an arrow, a label, a highlight and a pixelated patch, over the readout that shows View 400%, Box 84 by 68, Top-left 2112, 2630.</desc>

  <defs>
    <pattern id="pixel-grid" patternUnits="userSpaceOnUse" width="16" height="16">
      <path d="M16 0V16H0" fill="none" stroke="#171410" stroke-width="1"/>
    </pattern>
    <clipPath id="well">
      <rect x="601" y="73" width="534" height="199"/>
    </clipPath>
  </defs>

  <rect width="1200" height="400" fill="#0a0807"/>

  <!-- title block -->
  <g id="title-block">
    <text x="64" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="19" letter-spacing="2.6" fill="#9c9890">IMAGE ANNOTATOR · NO SERVER</text>

    <g transform="translate(64 157)" stroke="#f97c3d" fill="none">
      <rect x="2.83" y="2.83" width="22.34" height="22.34" stroke-width="2.1"/>
      <path d="M14 1.4v8.5M14 18.1v8.5M1.4 14h8.5M18.1 14h8.5" stroke-width="2.1"/>
      <rect x="12.6" y="12.6" width="2.8" height="2.8" fill="#f97c3d" stroke="none"/>
    </g>

    <text x="122" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="78" font-weight="600" letter-spacing="-3.1" fill="#efebe4">Snapmark</text>

    <text x="64" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="26" fill="#cecac3">Draw on a screenshot, then copy it</text>
    <text x="64" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="26" fill="#cecac3">at the image’s own size.</text>

    <text x="64" y="338" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="19" fill="#66635d">Next.js 16 · Canvas 2D · IndexedDB</text>
  </g>

  <!-- editor stage -->
  <g id="stage">
    <rect x="600" y="72" width="536" height="256" fill="#050403" stroke="#26231e" stroke-width="1"/>
    <g clip-path="url(#well)">
      <rect x="601" y="73" width="534" height="199" fill="url(#pixel-grid)"/>
    </g>

    <!-- the screenshot being annotated -->
    <g id="shot">
      <rect x="648" y="100" width="440" height="146" fill="#efece6" stroke="#cfc9bf" stroke-width="1"/>
      <rect x="648" y="100" width="440" height="24" fill="#e0dbd2"/>
      <rect x="660" y="108" width="8" height="8" fill="#b9b2a7"/>
      <rect x="674" y="108" width="8" height="8" fill="#b9b2a7"/>
      <rect x="700" y="109" width="96" height="6" fill="#b9b2a7"/>

      <rect x="668" y="138" width="300" height="7" fill="#a39c91"/>
      <rect x="668" y="166" width="240" height="7" fill="#8f887d"/>
      <rect x="668" y="196" width="330" height="7" fill="#a39c91"/>
      <rect x="668" y="222" width="200" height="7" fill="#a39c91"/>

      <!-- highlight: multiplies, so what is under it stays readable -->
      <rect x="664" y="188" width="210" height="20" fill="#f9db38" opacity="0.62"/>

      <!-- pixelate: recomputed from the original on every draw -->
      <g id="pixelate">
        <rect x="668" y="214" width="60" height="24" fill="#cfc9bf"/>
        <rect x="668" y="214" width="12" height="12" fill="#b9b2a7"/>
        <rect x="692" y="214" width="12" height="12" fill="#a39c91"/>
        <rect x="716" y="214" width="12" height="12" fill="#dcd7ce"/>
        <rect x="680" y="226" width="12" height="12" fill="#9b9489"/>
        <rect x="704" y="226" width="12" height="12" fill="#c4bdb2"/>
      </g>
    </g>

    <!-- label on its legibility plate -->
    <g id="label">
      <rect x="944" y="130" width="130" height="26" fill="#0a0807"/>
      <text x="954" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="18" fill="#f7f5f1">off by 1 px</text>
    </g>

    <!-- arrow -->
    <g id="arrow" stroke="#6db0f4" fill="#6db0f4">
      <path d="M1050 236 955 189" stroke-width="3" fill="none"/>
      <path d="M938 181 962 185 952 199Z" stroke="none"/>
    </g>

    <!-- the selected rectangle and its eight handles -->
    <g id="selection">
      <rect x="660" y="156" width="268" height="28" fill="none" stroke="#f97c3d" stroke-width="2.5"/>
      <g fill="#f7f5f1" stroke="#0a0807" stroke-width="1">
        <rect x="656.5" y="152.5" width="7" height="7"/>
        <rect x="790.5" y="152.5" width="7" height="7"/>
        <rect x="924.5" y="152.5" width="7" height="7"/>
        <rect x="656.5" y="166.5" width="7" height="7"/>
        <rect x="924.5" y="166.5" width="7" height="7"/>
        <rect x="656.5" y="180.5" width="7" height="7"/>
        <rect x="790.5" y="180.5" width="7" height="7"/>
        <rect x="924.5" y="180.5" width="7" height="7"/>
      </g>
    </g>

    <!-- the readout: every number is in the source image's own pixels -->
    <g id="readout">
      <rect x="601" y="272" width="534" height="55" fill="#0f0d09"/>
      <path d="M601 272.5H1135" stroke="#26231e" stroke-width="1"/>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
        <g font-size="16" letter-spacing="1.6" fill="#66635d">
          <text x="628" y="296">VIEW</text>
          <text x="790" y="296">BOX</text>
          <text x="952" y="296">TOP-LEFT</text>
        </g>
        <g font-size="22" fill="#efebe4">
          <text x="628" y="318">400%</text>
          <text x="790" y="318">84 × 68</text>
          <text x="952" y="318">2112, 2630</text>
        </g>
      </g>
    </g>
  </g>
</svg>
