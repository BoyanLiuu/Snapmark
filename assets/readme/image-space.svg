<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="440" viewBox="0 0 1200 440"
     role="img" aria-labelledby="is-title is-desc">
  <title id="is-title">Geometry is stored in image pixels</title>
  <desc id="is-desc">The same rectangle drawn at 25% zoom and at 400% zoom stores the same four numbers — x 2112, y 2630, w 84, h 68 — in the source image's own pixels, so both export the same 4554 by 3036 PNG, byte for byte.</desc>

  <defs>
    <pattern id="is-grid" patternUnits="userSpaceOnUse" width="14" height="14">
      <path d="M14 0V14H0" fill="none" stroke="#211d18" stroke-width="1"/>
    </pattern>
    <clipPath id="is-thumb-b">
      <rect x="84" y="296" width="132" height="72"/>
    </clipPath>
  </defs>

  <rect width="1200" height="440" fill="#0a0807"/>

  <text x="64" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="19" letter-spacing="2.6" fill="#9c9890">THE ONE RULE</text>
  <text x="64" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="30" fill="#efebe4">All annotation geometry is stored in the source image’s own pixels.</text>

  <!-- drawn at 25% -->
  <g id="pane-fit">
    <rect x="64" y="146" width="560" height="112" fill="#0f0d09" stroke="#26231e" stroke-width="1"/>
    <rect x="84" y="166" width="132" height="72" fill="#15120f" stroke="#2b2721" stroke-width="1"/>
    <rect x="140" y="191" width="23" height="17" fill="none" stroke="#f97c3d" stroke-width="2"/>
    <path d="M248 164V240" stroke="#26231e" stroke-width="1"/>
    <text x="276" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="18" letter-spacing="1.6" fill="#9c9890">DRAWN AT 25%</text>
    <text x="276" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="21" fill="#efebe4">x 2112  y 2630  w 84  h 68</text>
  </g>

  <!-- drawn at 400% -->
  <g id="pane-zoom">
    <rect x="64" y="276" width="560" height="112" fill="#0f0d09" stroke="#26231e" stroke-width="1"/>
    <rect x="84" y="296" width="132" height="72" fill="#15120f" stroke="#2b2721" stroke-width="1"/>
    <g clip-path="url(#is-thumb-b)">
      <rect x="84" y="296" width="132" height="72" fill="url(#is-grid)"/>
      <rect x="118" y="322" width="150" height="96" fill="none" stroke="#f97c3d" stroke-width="2"/>
    </g>
    <path d="M248 294V370" stroke="#26231e" stroke-width="1"/>
    <text x="276" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="18" letter-spacing="1.6" fill="#9c9890">DRAWN AT 400%</text>
    <text x="276" y="354" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="21" fill="#efebe4">x 2112  y 2630  w 84  h 68</text>
  </g>

  <!-- the two panes converge on one export -->
  <g id="converge" fill="none" stroke="#4f4a42" stroke-width="1.5">
    <path d="M624 202H668V332H624"/>
    <path d="M668 267H694"/>
  </g>
  <path d="M712 267 692 258 692 276Z" fill="#9c9890"/>

  <!-- the export -->
  <g id="export">
    <rect x="712" y="146" width="424" height="242" fill="#0f0d09" stroke="#26231e" stroke-width="1"/>
    <text x="744" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="18" letter-spacing="1.6" fill="#9c9890">EXPORTS, EITHER WAY</text>
    <g>
      <rect x="1020" y="170" width="84" height="34" fill="#15120f" stroke="#2b2721" stroke-width="1"/>
      <text x="1062" y="194" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="20" fill="#cecac3">⌘ C</text>
    </g>
    <text x="744" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="24" fill="#efebe4">snapmark-export.png</text>
    <text x="744" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="21" fill="#cecac3">4554 × 3036 · on the clipboard</text>
    <path d="M744 300H1104" stroke="#26231e" stroke-width="1"/>
    <text x="744" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="22" fill="#9c9890">Byte for byte the same, at any zoom.</text>
  </g>
</svg>
